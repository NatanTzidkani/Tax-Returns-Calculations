services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tax
      POSTGRES_PASSWORD: tax
      POSTGRES_DB: taxreturns
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax -d taxreturns"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
