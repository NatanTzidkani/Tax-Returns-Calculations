services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tax
      POSTGRES_PASSWORD: tax
      POSTGRES_DB: taxreturns
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax -d taxreturns"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @taxreturns/api dev"
    environment:
      DATABASE_URL: postgresql://tax:tax@db:5432/taxreturns
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ..:/app
      - api-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @taxreturns/web dev --host 0.0.0.0"
    environment:
      # Vite's dev-server proxy runs inside this container, so its default
      # (http://localhost:3000) points at itself, not the sibling api
      # container. Compose's default network resolves service names as
      # hostnames, so "api" reaches the api container's port 3000.
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ..:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  api-node-modules:
  web-node-modules:
